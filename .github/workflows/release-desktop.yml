name: Release desktop apps

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag"
        required: true
        default: "v0.9.4"

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows portable exe
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        shell: bash
        run: corepack enable

      - name: Install dependencies
        shell: bash
        run: corepack pnpm install --frozen-lockfile

      - name: Build portable exe
        shell: bash
        run: corepack pnpm clean:release && corepack pnpm desktop:build && corepack pnpm exec electron-builder --win portable --publish never

      - name: Verify sharp native files
        shell: bash
        run: |
          test -f "release/win-unpacked/resources/app.asar.unpacked/node_modules/sharp/package.json"
          test -f "release/win-unpacked/resources/app.asar.unpacked/node_modules/@img/sharp-win32-x64/lib/sharp-win32-x64.node"

      - name: Upload exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: codenames-windows-portable
          path: release/*.exe
          if-no-files-found: error

  build-macos:
    name: Build macOS portable zip
    runs-on: macos-13

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        shell: bash
        run: corepack enable

      - name: Install dependencies
        shell: bash
        run: corepack pnpm install --frozen-lockfile

      - name: Build macOS zip
        shell: bash
        run: corepack pnpm clean:release && corepack pnpm desktop:build && corepack pnpm exec electron-builder --mac zip --x64 --publish never

      - name: Verify sharp native files
        shell: bash
        run: |
          test -f "release/mac/行动代号.app/Contents/Resources/app.asar.unpacked/node_modules/sharp/package.json"
          test -d "release/mac/行动代号.app/Contents/Resources/app.asar.unpacked/node_modules/@img"

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: codenames-macos-portable
          path: release/*.zip
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs:
      - build-windows
      - build-macos
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}

    steps:
      - uses: actions/checkout@v6

      - name: Download exe artifact
        uses: actions/download-artifact@v5
        with:
          name: codenames-windows-portable
          path: dist

      - name: Download macOS artifact
        uses: actions/download-artifact@v5
        with:
          name: codenames-macos-portable
          path: dist

      - name: Publish desktop assets
        shell: bash
        run: |
          ls -la dist
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/*.exe dist/*.zip --clobber
          else
            gh release create "$RELEASE_TAG" dist/*.exe dist/*.zip \
              --target "$GITHUB_SHA" \
              --title "$RELEASE_TAG" \
              --notes "行动代号桌面便携版，包含 Windows .exe 和 macOS .zip。"
          fi
