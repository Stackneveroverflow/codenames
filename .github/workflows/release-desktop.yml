name: Release desktop apps

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag"
        required: true
        default: "v0.9.1"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            os: windows-latest
            build_command: corepack pnpm clean:release && corepack pnpm desktop:build && corepack pnpm exec electron-builder --win portable --publish never
            asset_glob: release/*.exe
          - platform: macos
            os: macos-latest
            build_command: corepack pnpm clean:release && corepack pnpm desktop:build && corepack pnpm exec electron-builder --mac zip --universal --publish never
            asset_glob: release/*.zip

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        shell: bash
        run: corepack enable

      - name: Install dependencies
        shell: bash
        run: corepack pnpm install --no-frozen-lockfile

      - name: Build portable package
        shell: bash
        run: ${{ matrix.build_command }}

      - name: Upload portable package
        uses: actions/upload-artifact@v4
        with:
          name: codenames-${{ matrix.platform }}
          path: ${{ matrix.asset_glob }}
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: build
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}

    steps:
      - name: Download portable packages
        uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true

      - name: Publish release assets
        shell: bash
        run: |
          ls -la dist
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/* --clobber
          else
            gh release create "$RELEASE_TAG" dist/* \
              --target "$GITHUB_SHA" \
              --title "$RELEASE_TAG" \
              --notes "行动代号桌面便携版：Windows .exe 和 macOS .zip。"
          fi
